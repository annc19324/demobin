<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EngMastery - Học & Kiểm Tra Tiếng Anh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="app-wrapper">
    <!-- Header tối giản -->
    <header class="app-header">
      <div class="logo">
        <span class="logo-badge">ENG</span>
        <span class="logo-title">Mastery</span>
      </div>

      <!-- 2 Chế độ chính: Ôn tập & Kiểm tra -->
      <div class="mode-switch">
        <button id="tab-review" class="mode-btn active">📖 Phần Ôn</button>
        <button id="tab-test" class="mode-btn">📝 Phần Kiểm Tra</button>
      </div>

      <button id="sound-toggle" class="sound-btn" title="Bật/Tắt âm">🔊</button>
    </header>

    <!-- Khung làm bài chính -->
    <main id="quiz-container" class="card-quiz">
      <!-- Thanh tiến trình & Thông tin câu -->
      <div class="quiz-top">
        <span id="quiz-badge" class="badge">Phần Ôn: Bài 1/16</span>
        <span id="quiz-step-info" class="sub-badge">Bước 1: Cấu trúc</span>
      </div>

      <!-- Gợi ý nghĩa tiếng Việt -->
      <div class="prompt-box">
        <div class="prompt-label">Nghĩa tiếng Việt:</div>
        <div id="prompt-vi" class="prompt-text">Trông mong, mong đợi điều gì</div>
      </div>

      <!-- Khu vực 2 cột tương tác -->
      <div class="interactive-area">
        <!-- Cột trái: Thẻ cần ghép -->
        <div class="left-col">
          <div class="col-hint">Cột trái (kéo hoặc chạm)</div>
          <div id="drag-source" class="source-card" draggable="true">
            <div class="drag-icon">⠿</div>
            <div id="source-text" class="source-text">look forward</div>
          </div>
          <div class="guide-text">Kéo sang phải hoặc bấm để chọn</div>
        </div>

        <!-- Cột phải: 4 đáp án -->
        <div class="right-col">
          <div class="col-hint">Cột phải (chọn đáp án đúng)</div>
          <div id="options-grid" class="options-grid">
            <!-- Render động bằng JS -->
          </div>
        </div>
      </div>

      <!-- Thanh thông báo kết quả gọn gàng -->
      <div id="feedback-bar" class="feedback-bar">
        <span id="feedback-msg"></span>
        <button id="btn-next-action" class="btn-next hidden">Tiếp tục ➔</button>
      </div>
    </main>

    <!-- Màn hình kết quả thang điểm 10 (Chỉ cho Phần Kiểm Tra) -->
    <section id="test-result-container" class="card-quiz result-card hidden">
      <div class="result-icon">📊</div>
      <h2 class="result-title">Kết Quả Kiểm Tra</h2>
      
      <div class="score-display">
        <div class="score-main"><span id="final-score-10">0.0</span> <small>/ 10</small></div>
        <div class="score-detail" id="final-detail-text">Đúng 0 / 10 câu</div>
      </div>

      <p id="score-comment" class="score-comment">Hãy tiếp tục luyện tập để đạt điểm cao hơn nhé!</p>

      <div class="result-actions">
        <button id="btn-restart-test" class="btn-action primary">🔄 Làm bài kiểm tra khác</button>
        <button id="btn-switch-to-review" class="btn-action secondary">📖 Quay lại phần ôn</button>
      </div>
    </section>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
